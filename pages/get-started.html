  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --navy: #0f0f1a;
      --indigo: #4f46e5;
      --indigo-light: #6366f1;
      --white: #ffffff;
    }

    /* ── CTA ── */
    .cta-section {
      background: var(--navy);
      text-align: center;
      padding: 100px 40px;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    .cta-section .section-label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: #818cf8;
      margin-bottom: 12px;
    }

    .cta-section h2 {
      font-size: clamp(28px, 4vw, 46px);
      font-weight: 800;
      color: var(--white);
      letter-spacing: -1px;
      margin-bottom: 16px;
      line-height: 1.2;
    }

    .cta-section p {
      font-size: 18px;
      color: #94a3b8;
      max-width: 520px;
      margin: 0 auto 40px;
      line-height: 1.7;
    }

    .btn-primary {
      background: var(--indigo);
      color: var(--white);
      padding: 14px 32px;
      border-radius: 10px;
      font-size: 16px;
      font-weight: 700;
      text-decoration: none;
      transition: background 0.2s, transform 0.15s;
      display: inline-block;
    }

    .btn-primary:hover { background: var(--indigo-light); transform: translateY(-1px); }

    .cta-divider {
      display: flex;
      align-items: center;
      gap: 16px;
      max-width: 460px;
      margin: 40px auto 28px;
      color: #64748b;
      font-size: 13px;
    }

    .cta-divider::before, .cta-divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: rgba(255,255,255,0.12);
    }

    .cta-form {
      max-width: 460px;
      margin: 0 auto;
      text-align: left;
    }

    .cta-form-row {
      display: flex;
      flex-direction: column;
      gap: 12px;
      margin-bottom: 16px;
    }

    .cta-form-row input {
      background: rgba(255,255,255,0.06);
      border: 1.5px solid rgba(255,255,255,0.15);
      border-radius: 10px;
      padding: 13px 16px;
      font-size: 14px;
      color: var(--white);
      font-family: inherit;
      outline: none;
      transition: border-color 0.2s, background 0.2s;
      width: 100%;
    }

    .cta-form-row input::placeholder { color: #64748b; }
    .cta-form-row input:focus { border-color: var(--indigo-light); background: rgba(255,255,255,0.09); }

    .cta-consent {
      display: flex;
      gap: 10px;
      align-items: flex-start;
      margin-bottom: 20px;
      font-size: 12.5px;
      color: #94a3b8;
      line-height: 1.5;
      cursor: pointer;
    }

    .cta-consent input { margin-top: 2px; flex-shrink: 0; }

    .cta-form-msg {
      margin-top: 14px;
      font-size: 13.5px;
      min-height: 18px;
    }

    .cta-form-msg.success { color: #6ee7b7; }
    .cta-form-msg.error { color: #fca5a5; }

    .cta-form button[disabled] { opacity: 0.6; cursor: default; }

    @media (max-width: 768px) {
      .cta-section { padding: 60px 20px; }
    }
  </style>

<!-- ══════════════════════════════════════════════════════════ -->
<!-- GET STARTED — final contact / conversion section          -->
<!-- ══════════════════════════════════════════════════════════ -->
<section class="cta-section" id="contact">

  <!-- ── Headline & copy ── -->
  <div class="section-label">Get Started</div>
  <h2>Ready to put AI to work<br/>for your business?</h2>
  <p>Book a free 30-minute strategy call. We'll map out exactly which automations would have the biggest impact on your growth — no obligation, no hard sell.</p>

  <!-- ── Primary path: book a call ── -->
  <a href="https://calendar.app.google/oqTcitaDB6RRbLiy5" target="_blank" rel="noopener" class="btn-primary" style="font-size:17px; padding:16px 40px;">Schedule a Free Call →</a>

  <div class="cta-divider"><span>or leave your details and we'll be in touch</span></div>

  <!-- ── Secondary path: enquiry form → CRM webhook ── -->
  <form class="cta-form" id="enquiry-form">
    <div class="cta-form-row">
      <input type="text" id="enq-name" placeholder="Your name" required />
      <input type="email" id="enq-email" placeholder="Email address" required />
      <input type="tel" id="enq-phone" placeholder="Phone (optional)" />
    </div>
    <label class="cta-consent">
      <input type="checkbox" id="enq-consent" required />
      <span>By submitting, you agree to receive emails from LIP Services about your enquiry.</span>
    </label>
    <button type="submit" class="btn-primary" id="enq-submit" style="width:100%">Send Enquiry</button>
    <div class="cta-form-msg" id="enq-msg"></div>
  </form>
</section>

<!-- ── Form handler: posts enquiry to LIPS-CRM landing webhook ── -->
<script>
(function(){
  var LANDING_ORG_ID = '437097e2-f5f7-4f4a-9623-d0f8952ed71c';
  var LANDING_URL    = 'https://crm.lipservices.com.au/api/webhooks/landing';

  // Reads ?src= off the page URL so bio links, ads, and future landing
  // pages each report distinctly in the CRM instead of all landing as
  // one undifferentiated 'landing_page' source.
  function leadSource(){
    return new URLSearchParams(window.location.search).get('src') || 'landing_page';
  }

  document.getElementById('enquiry-form').addEventListener('submit', async function(e){
    e.preventDefault();

    var btn     = document.getElementById('enq-submit');
    var msg     = document.getElementById('enq-msg');
    var name    = document.getElementById('enq-name').value.trim();
    var email   = document.getElementById('enq-email').value.trim();
    var phone   = document.getElementById('enq-phone').value.trim();
    var consent = document.getElementById('enq-consent').checked;

    if (!name || !email || !consent) return;

    btn.disabled = true;
    btn.textContent = 'Sending…';
    msg.textContent = '';
    msg.className = 'cta-form-msg';

    try {
      var res  = await fetch(LANDING_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ org_id: LANDING_ORG_ID, name: name, email: email, phone: phone, source: leadSource(), consent: true }),
      });
      var data = await res.json();
      if (!res.ok) throw new Error(data.error || 'Something went wrong');

      document.getElementById('enquiry-form').reset();
      msg.textContent = "Thanks! We'll be in touch shortly.";
      msg.className = 'cta-form-msg success';
    } catch (err) {
      msg.textContent = "Couldn't send that, please try again or book a call above.";
      msg.className = 'cta-form-msg error';
      console.error('[enquiry form]', err);
    }

    btn.disabled = false;
    btn.textContent = 'Send Enquiry';
  });
})();
</script>
